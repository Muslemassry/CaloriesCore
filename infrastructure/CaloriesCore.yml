  Deployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref CaloriesCoreFunctionsApi
      Description: !Sub "Deployment-${Environment}-${SourceCodeS3Key}"
    DependsOn:
      - FoodLoggingMethod
      - FoodAnalysisMethod
      - FoodIntakeHistoryMethod
      - RegistrationPublicMethod
      - ConfirmRegistrationPublicMethod
      - LoginMethod
      - RegisterAuthMethod
      - VerifyEmailAuthMethod
      - ResendVerificationCodeAuthMethod
      - LoginAuthMethod
      - ForgotPasswordAuthMethod
      - VerifyResetCodeAuthMethod
      - ResendResetCodeAuthMethod
      - ResetPasswordAuthMethod
      - RefreshAuthMethod
      - LogoutAuthMethod
      - GoalSetupPatchMethod
      - GoalSetupGetMethod
      - GoalSetupPutMethod
      - GoalsGetMethod
      - GoalsPutMethod
      - MealsAnalyzeMethod
      - MealsGetMethod
      - MealsPostMethod
      - MealDetailGetMethod
      - MealDetailPutMethod
      - MealDetailDeleteMethod
  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Sub "${Environment}"
      RestApiId: !Ref CaloriesCoreFunctionsApi
      DeploymentId: !Ref Deployment
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
  S3EventDebugLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/events/${SourceCodeBucketName}-debug-logs"
      RetentionInDays: 7
  EventBridgeToCloudWatchLogsPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: EventBridgeToCloudWatchLogsPolicy
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowEventBridgeToCreateLogStreamsAndPutLogs",
              "Effect": "Allow",
              "Principal": {
                "Service": "events.amazonaws.com"
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "${S3EventDebugLogGroup.Arn}:*"
            }
          ]
        }
  EventBridgeRuleForFoodAnalysisTriggeredLambdaFunction:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "FoodAnalysisTriggeredLambdaFunctionRule-${Environment}"
      State: "ENABLED"
      EventPattern:
        source:
          - "aws.s3"
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref UploadingBucketName
          object:
            key:
              - prefix: uploads/
      Targets:
        - Arn: !GetAtt FoodAnalysisTriggeredLambdaFunction.Arn
          Id: FoodAnalysisTriggeredLambdaFunctionTarget
        - Arn: !GetAtt S3EventDebugLogGroup.Arn
          Id: TargetCloudWatchLogGroup
  AllowEventBridgeToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt FoodAnalysisTriggeredLambdaFunction.Arn
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt EventBridgeRuleForFoodAnalysisTriggeredLambdaFunction.Arn
