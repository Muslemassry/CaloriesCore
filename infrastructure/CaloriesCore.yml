AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Environment:
    Type: String
    Default: "dev"
    AllowedValues:
      - dev
      - uat
      - prod
    Description: "The environment for the S3 bucket (dev, uat or prod)"
  UserPoolId:
    Type: String
    Description: "The ID of the Cognito User Pool"
  UploadingBucketName:
    Type: String
    Description: "The name of the S3 bucket for uploading files"  
  SourceCodeBucketName:
    Type: String
    Description: "The name of the S3 bucket where the Lambda function code is stored"
  SourceCodeS3Key:
    Type: String
    Description: "The key of the S3 object containing the Lambda function code"
  LambdaVersion:
    Type: String
    Description: The version of the Lambda function code  
Resources:
  # role for lambda functions to access dynamodb tables
  RoleForLmbdaToAccessDynamoDB:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy1"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  # role for lambda functions to access cognito user pool
  RoleForLoginLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-LoginRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaCognitoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminConfirmSignUp
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy2"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForRegistrationLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-RegistrationRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaSESSendEmailPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy3"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForConfirmRegistrationLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-ConfirmRegistrationRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaCognitoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy3"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-ConfirmRegistrationSESSendEmailPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
  RoleForFoodAnalysisLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-FoodAnalysisRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaS3Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaLogsPolicy4"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForFoodAnalysisTriggeredLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-TriggeredLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaS3Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "*" 
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaBedrockPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*" 
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaLogsPolicy5"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-BedrockInvokePermissions"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: 'arn:aws:bedrock:*::foundation-model/*'
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-RekognitionPermissions"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                Resource: '*'
  RoleForLmbdaToAccessS3:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaS3Role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaS3Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-LambdaLogsPolicy6"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForGoalsLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-GoalsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-GoalsDynamoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-GoalsLogsPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForProfileLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-ProfileRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-ProfileDynamoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-ProfileLogsPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  RoleForMealManagementLambdaFunction:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CaloriesCoreFunctions-${Environment}-MealManagementRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-MealManagementDynamoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "*"
        - PolicyName: !Sub "CaloriesCoreFunctions-${Environment}-MealManagementLogsPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
  # lambda functions
  LoginLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LoginLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForLoginLambdaFunction.Arn
      Handler: LoginLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolId
          USER_TABLE_NAME: !Sub "UserTable-${Environment}"
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  RegistrationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "RegistrationLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForRegistrationLambdaFunction.Arn
      Handler: RegistrationLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          USER_TABLE_NAME: !Sub "UserTable-${Environment}"
          USER_ID_COUNTER_TABLE_NAME: !Sub "UserIdCounter-${Environment}"
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  ConfirmRegistrationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "ConfirmRegistrationLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForConfirmRegistrationLambdaFunction.Arn
      Handler: ConfirmRegistrationLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          USER_TABLE_NAME: !Sub "UserTable-${Environment}"
          USER_POOL_ID: !Ref UserPoolId
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  FoodAnalysisLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "FoodAnalysisLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForFoodAnalysisLambdaFunction.Arn
      Handler: FoodAnalysisLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          Food_Analysis_Request_Table_Name: !Sub "MealAnalysisRequest-${Environment}"
          Uploading_Bucket_Name: !Ref UploadingBucketName
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  FoodAnalysisTriggeredLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "FoodAnalysisTriggeredLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForFoodAnalysisTriggeredLambdaFunction.Arn
      Handler: FoodAnalysisTriggeredLambda.handler
      Timeout: 60
      MemorySize: 512
      Runtime: nodejs24.x
      Environment:
        Variables:
          Food_Analysis_Request_Table_Name: !Sub "MealAnalysisRequest-${Environment}"
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  FoodLoggingLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "FoodLoggingLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForLmbdaToAccessDynamoDB.Arn
      Handler: FoodLoggingLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          MEAL_LOG_TABLE_NAME: !Sub "MealLog-${Environment}"
          DAY_INTAKE_TABLE_NAME: !Sub "DayIntake-${Environment}"
          USER_ID_COUNTER_TABLE_NAME: !Sub "UserIdCounter-${Environment}"
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  FoodIntakeHistoryLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "FoodIntakeHistoryLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForLmbdaToAccessDynamoDB.Arn
      Handler: FoodIntakeHistoryLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Environment:
        Variables:
          HISTORY_INTAKE_TABLE_NAME: !Sub "HistoryIntake-${Environment}"
      Code: 
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Architectures:
        - x86_64
  GoalsLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "GoalsLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForGoalsLambdaFunction.Arn
      Handler: GoalsLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Code:
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Environment:
        Variables:
          USER_TABLE_NAME: !Sub "UserTable-${Environment}"
      Architectures:
        - x86_64
  ProfileLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "ProfileLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForProfileLambdaFunction.Arn
      Handler: ProfileLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Code:
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Environment:
        Variables:
          USER_TABLE_NAME: !Sub "UserTable-${Environment}"
      Architectures:
        - x86_64
  MealManagementLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "MealManagementLambdaFunction-${Environment}-${LambdaVersion}"
      Role: !GetAtt RoleForMealManagementLambdaFunction.Arn
      Handler: MealManagementLambda.handler
      Timeout: 5
      Runtime: nodejs24.x
      Code:
        S3Bucket: !Ref SourceCodeBucketName
        S3Key: !Ref SourceCodeS3Key
      Environment:
        Variables:
          MEAL_LOG_TABLE_NAME: !Sub "MealLog-${Environment}"
          USER_ID_COUNTER_TABLE_NAME: !Sub "UserIdCounter-${Environment}"
      Architectures:
        - x86_64
  # api gatewayrole for logging
  RoleForApiGatwayToaccessCloudWatch:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
  ApiGatewayAccountSettings:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt RoleForApiGatwayToaccessCloudWatch.Arn
  # api gateway
  CaloriesCoreFunctionsApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "CaloriesCoreFunctionsApi-${Environment}"
      Description: "API Gateway for Calories Core Functions"
      EndpointConfiguration:
        Types:
          - REGIONAL
  # reource
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "login"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  RegistrationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "register"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  ConfirmRegistrationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "confirm-registration"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  FoodAnalysisResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "food-analysis"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  FoodLoggingResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "food-logging"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  FoodIntakeHistoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "food-intake-history"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "authenticate"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  RegisterAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "register"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  VerifyEmailAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "verify-email"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  ResendVerificationCodeAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "resend-verification-code"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  LoginAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "login"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  ForgotPasswordAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "forgot-password"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  VerifyResetCodeAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "verify-reset-code"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  ResendResetCodeAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "resend-reset-code"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  ResetPasswordAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "reset-password"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  RefreshAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "refresh"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  LogoutAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: "logout"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  GoalSetupResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "goal-setup"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  GoalsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "goals"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  MealsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CaloriesCoreFunctionsApi.RootResourceId
      PathPart: "meals"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  MealsAnalyzeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref MealsResource
      PathPart: "analyze"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  MealIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref MealsResource
      PathPart: "{mealId}"
      RestApiId: !Ref CaloriesCoreFunctionsApi
  #authorizer
  ApiGatewayCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: ApiGatewayCognitoAuthorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref CaloriesCoreFunctionsApi
      ProviderARNs:
        - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
      IdentitySource: method.request.header.Authorization
  # method
  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CaloriesCoreFunctionsApi
